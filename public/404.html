<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      // SPA fallback for GitHub Pages
      // Redirects unknown paths back to index.html with the path encoded in the query string
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host +
        l.pathname.split('/').slice(0, 2).join('/') +
        '/?r=' + encodeURIComponent(l.pathname.slice(1).split('/').slice(1).join('/')) +
        (l.search ? '&' + l.search.slice(1) : '') +
        l.hash
      );
    </script>
  </head>
</html>
