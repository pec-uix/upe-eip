<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/layers.css">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>統流開發 員工入口網站</title>
    <script>
      // Restore path redirected by 404.html for GitHub Pages SPA routing
      (function () {
        var r = new URLSearchParams(window.location.search).get('r');
        if (r) {
          var base = window.location.pathname.replace(/\/$/, '');
          window.history.replaceState(null, null, base + '/' + decodeURIComponent(r) + window.location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
